query GetCartQuery($cartId:ID!){
    cart(id: $cartId) {
        id
        checkoutUrl
        totalQuantity
        buyerIdentity {
            customer {
                email
            }
        }
        lines(first: 10) {
            edges {
                node {
                    id
                    quantity
                    merchandise {
                        ... on ProductVariant {
                            id
                            title
                            price {
                                amount
                                currencyCode
                            }
                            product {
                                title
                                featuredImage{
                                    url
                                }
                            }
                        }
                    }
                }
            }
        }
        discountCodes {
            code
            applicable
        }
        cost {
            totalAmount {
                amount
                currencyCode
            }
        }
    }
}
